name: Publish install ZIP

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Reviewed main commit SHA
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_COMMIT: ${{ inputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful validation of this commit
        run: |
          test "$REVIEWED_COMMIT" = "$GITHUB_SHA"
          for workflow in validate.yml upgrade.yml; do
            gh run list --workflow "$workflow" --branch main --commit "$GITHUB_SHA" \
              --status success --json databaseId --jq 'length > 0' | grep -qx true
          done
      - name: Package and publish
        run: |
          package=$(bash scripts/package.sh)
          version=${package#dist/ashbi-testimonials-}
          version=${version%.zip}
          unzip -tq "$package"
          {
            printf '## What’s new\n\n'
            awk -v heading="= $version =" '$0 == heading { show=1; next } show && /^= / { exit } show { print }' readme.txt
            printf '\n## Install or upgrade\n\nUpload the plugin ZIP in WordPress under **Plugins → Add New → Upload Plugin**. Requires WordPress 6.6+ and PHP 8.2+. Back up the site before upgrading and replace the existing plugin in place. See the [upgrade and recovery guide](https://github.com/camster91/ashbi-testimonials/blob/main/docs/OPERATIONS.md).\n'
          } > release-notes.md
          gh release create "v$version" "$package" --target "$GITHUB_SHA" \
            --title "Ashbi Testimonials $version" --notes-file release-notes.md --latest
